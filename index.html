<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- FORZA BARRE BROWSER NERE E SCURE SU IPHONE E ANDROID -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <title>Impromart</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #000000;
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------------------------
            1. SCHERMATA INTRO LOGO (3 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-logo-img {
            max-width: 50vw;
            max-height: 35vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(12px);
            animation: continuousZoomFade 2.8s linear forwards;
        }

        @keyframes continuousZoomFade {
            0% { opacity: 0; transform: scale(0.92); filter: blur(12px); }
            30% { opacity: 1; filter: blur(0px); }
            70% { opacity: 1; filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.05); filter: blur(10px); }
        }

        /* ----------------------------------------------------
            2. CONTAINER PRINCIPALE / CAROSELLO SCHEDE
        ---------------------------------------------------- */
        .card-container {
            width: 90%;
            max-width: 380px;
            height: 90vh;
            max-height: 760px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            animation: fadeInCard 0.8s ease forwards 2.6s;
            position: relative;
        }

        @keyframes fadeInCard {
            to { opacity: 1; }
        }

        /* WRAPPER SCORRIBILE PER LE PAGINE (SWIPE) */
        .pages-wrapper {
            display: flex;
            width: 200%;
            height: calc(100% - 35px);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card-page {
            width: 50%;
            height: 100%;
            padding: 24px 20px 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .card-page::-webkit-scrollbar {
            display: none;
        }

        /* INDICATORI A PALLINI (DOTS) IN BASSO */
        .pagination-dots {
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .dot.active {
            width: 20px;
            border-radius: 4px;
            background: #e60000;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* ELEMENTI INIZIALMENTE NASCOSTI PER L'ANIMAZIONE IN SEQUENZA */
        .animate-seq {
            opacity: 0;
            transform: translateY(20px);
            filter: blur(8px);
            animation: seqFadeIn 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        .animate-line-seq {
            opacity: 0;
            transform: scaleX(0);
            animation: seqExpandLine 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        @keyframes seqFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes seqExpandLine {
            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* SEQUENZA DEI RITARDI (PARTONO SUBITO DOPO L'INTRO A 2.6s) */
        .delay-1 { animation-delay: 2.7s; } /* Logo */
        .delay-2 { animation-delay: 3.0s; } /* Titolo concessionaria */
        .delay-3 { animation-delay: 3.3s; } /* Linea rossa */
        .delay-4 { animation-delay: 3.6s; } /* Come possiamo aiutarti? */
        .delay-5 { animation-delay: 3.9s; } /* Pulsanti contatti */
        .delay-6 { animation-delay: 4.2s; } /* Box assistenza */

        /* LOGO AZIENDALE NELLA CARD */
        .card-logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-logo-img {
            max-width: 220px;
            max-height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
        }

        /* RUOLO / TESTO SPLITTATO SU DUE RIGHE */
        .job-title {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 8px;
            line-height: 1.4;
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 120px;
            height: 3px;
            background-color: #e60000;
            margin: 12px auto 8px auto;
            border-radius: 2px;
            transform-origin: center;
            box-shadow: 0 0 12px rgba(230, 0, 0, 0.5);
        }

        /* FRASE SOTTO LA LINEA ROSSA */
        .help-text {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        /* CONTATTI (PULSANTI/SCHEDE) */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-action:active {
            background: rgba(41, 128, 185, 0.3);
            border-color: #2980b9;
            transform: scale(0.98);
        }

        /* ICONA TELEFONO BIANCA */
        .svg-icon {
            width: 16px;
            height: 16px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* RIQUADRO ROSSO PER H24 */
        .badge-h24 {
            background-color: #e60000;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 3px 6px;
            border-radius: 5px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 8px rgba(230, 0, 0, 0.4);
        }
