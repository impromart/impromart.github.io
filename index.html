<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- FORZA BARRE BROWSER NERE E SCURE SU IPHONE E ANDROID -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <title>Impromart - MAN</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------------------------
            1. SCHERMATA INTRO LOGO (3 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.8s ease;
        }

        #loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .intro-logo-img {
            max-width: 60vw;
            max-height: 40vh;
            object-fit: contain;
            animation: pulseIntro 2.5s ease infinite alternate;
        }

        @keyframes pulseIntro {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* ----------------------------------------------------
            2. BIGLIETTO DA VISITA DIGITALE
        ---------------------------------------------------- */
        .card {
            width: 92%;
            max-width: 380px;
            height: 90vh;
            max-height: 750px;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* LOGO PRINCIPALE */
        .main-logo-container {
            width: 100%;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-logo-img {
            max-width: 90%;
            max-height: 80px;
            object-fit: contain;
        }

        /* RUOLO / CONCESSIONARIA SU DUE RIGHE */
        .job-title {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 8px;
            line-height: 1.35;
            width: 100%;
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 90px;
            height: 3px;
            background-color: #e60000;
            margin: 10px auto;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(230, 0, 0, 0.6);
        }

        /* CONTATTI (PULSANTI) */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 9px 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-action:active {
            background: rgba(230, 0, 0, 0.25);
            border-color: #e60000;
            transform: scale(0.98);
        }

        /* ICONE VETTORIALI BIANCHE */
        .svg-icon {
            width: 16px;
            height: 16px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* BADGE H24 */
        .h24-badge {
            background-color: #e60000;
            color: #ffffff;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(230, 0, 0, 0.6);
        }

        /* SEZIONE SOCIAL & WEB IN BASSO */
        .social-web-container {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 8px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .btn-social:active {
            background: rgba(230, 0, 0, 0.25);
            border-color: #e60000;
            transform: scale(0.98);
        }

        /* AZIENDA & PARTITA IVA */
        .company-info {
            text-align: center;
            font-size: 0.75rem;
            line-height: 1.35;
            color: rgba(255, 255, 255, 0.75);
            width: 100%;
        }

        .company-name {
            font-weight: 800;
            font-size: 0.86rem;
            margin-bottom: 1px;
            color: #ffffff;
        }

        .piva-text {
            color: rgba(255, 255, 255, 0.55) !important;
            font-size: 0.68rem;
            font-weight: 500;
            display: block;
            margin-top: 1px;
        }
    </style>
</head>

<body>

    <!-- INTRO LOGO -->
    <div id="loader">
        <img src="logo intro.png" alt="Logo" class="intro-logo-img">
    </div>

    <!-- CARD DIGITALE -->
    <div class="card" id="mainCard">
        <div class="header-content">
            <!-- Logo Principale -->
            <div class="main-logo-container">
                <img src="logo impromart.png" alt="Logo Impromart" class="main-logo-img">
            </div>

            <!-- Ruolo / Concessionaria su due righe -->
            <div class="job-title">
                CONCESSIONARIA ED OFFICINA<br>AUTORIZZATA MAN
            </div>

            <!-- Linea Rossa MAN -->
            <div class="red-line"></div>

            <!-- Contatti -->
            <div class="contact-info">
                <!-- EMAIL -->
                <a href="mailto:info@impromart.com" class="btn-action">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    info@impromart.com
                </a>

                <!-- TELEFONO PRINCIPALE -->
                <a href="#" onclick="handlePhoneClick(event)" class="btn-action">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                    </svg>
                    +39 081 596 2139
                </a>

                <!-- SOCCORSO H24 -->
                <a href="tel:999999999" class="btn-action">
                    <span class="h24-badge">H24</span>
                    Soccorso: 999 9999 999
                </a>
            </div>
        </div>

        <!-- SOCIAL & WEB -->
        <div class="social-web-container">
            <!-- Instagram -->
            <a href="https://www.instagram.com/impromart.it?mdxt=MThyZjU2eXNuYW5zbA==" target="_blank" class="btn-social">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
                Instagram
            </a>

            <!-- Sito Web -->
            <a href="https://www.impromart.it" target="_blank" class="btn-social">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                Sito Web
            </a>
        </div>

        <!-- Dati Aziendali -->
        <div class="company-info">
            <div class="company-name">Impromart SRL</div>
            Traversa Fossitelli snc &bull; 80147 Napoli<br>
            <span class="piva-text">P.IVA: 04911&#8203;050633</span>
        </div>
    </div>

    <script>
        // Gestione fluida della comparsa dopo 2.5 secondi esatti
        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const loader = document.getElementById("loader");
                const card = document.getElementById("mainCard");
                
                if (loader) {
                    loader.classList.add("fade-out");
                    setTimeout(() => loader.style.display = 'none', 800);
                }
                if (card) {
                    card.classList.add("visible");
                }
            }, 2500);
        });

        // Funzione per vCard e chiamata
        function handlePhoneClick(e) {
            e.preventDefault();
            
            const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Impromart;Concessionaria;;;
FN:Impromart SRL - MAN
ORG:Impromart SRL
TITLE:Concessionaria ed Officina Autorizzata MAN
TEL;TYPE=WORK:+390815962139
EMAIL;TYPE=WORK:info@impromart.com
ADR;TYPE=WORK:;;Traversa Fossitelli snc;Napoli;;80147;Italy
URL:https://www.impromart.it
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('download', 'Impromart_MAN.vcf');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                window.location.href = "tel:+390815962139";
            }, 300);
        }
    </script>
</body>
</html>
