<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- FORZA BARRE BROWSER NERE E SCURE SU IPHONE E ANDROID -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <title>Impromart</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #000000;
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------------------------
            1. SCHERMATA INTRO LOGO (3 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-logo-img {
            max-width: 50vw;
            max-height: 35vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(12px);
            animation: continuousZoomFade 2.8s linear forwards;
        }

        @keyframes continuousZoomFade {
            0% { opacity: 0; transform: scale(0.92); filter: blur(12px); }
            30% { opacity: 1; filter: blur(0px); }
            70% { opacity: 1; filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.05); filter: blur(10px); }
        }

        /* ----------------------------------------------------
            2. CONTAINER PRINCIPALE / CAROSELLO SCHEDE
        ---------------------------------------------------- */
        .card-container {
            width: 90%;
            max-width: 380px;
            height: 88vh;
            max-height: 750px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            animation: fadeInCard 1.2s ease forwards 2.8s;
            position: relative;
        }

        @keyframes fadeInCard {
            to { opacity: 1; }
        }

        /* WRAPPER SCORRIBILE PER LE PAGINE (SWIPE) */
        .pages-wrapper {
            display: flex;
            width: 200%;
            height: calc(100% - 35px);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card-page {
            width: 50%;
            height: 100%;
            padding: 28px 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
        }

        .card-page::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* INDICATORI A PALLINI (DOTS) IN BASSO */
        .pagination-dots {
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .dot.active {
            width: 20px;
            border-radius: 4px;
            background: #e60000;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* LOGO AZIENDALE NELLA CARD */
        .card-logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        .card-logo-img {
            max-width: 240px;
            max-height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
        }

        /* RUOLO / TESTO SPLITTATO SU DUE RIGHE */
        .job-title {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 8px;
            line-height: 1.4;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 120px;
            height: 3px;
            background-color: #e60000;
            margin: 14px auto 10px auto;
            border-radius: 2px;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: center;
            box-shadow: 0 0 12px rgba(230, 0, 0, 0.5);
        }

        /* FRASE SOTTO LA LINEA ROSSA */
        .help-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 14px;
            letter-spacing: 0.3px;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        /* CONTATTI (PULSANTI/SCHEDE) */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-action:active {
            background: rgba(41, 128, 185, 0.3);
            border-color: #2980b9;
            transform: scale(0.98);
        }

        /* ICONA TELEFONO BIANCA */
        .svg-icon {
            width: 16px;
            height: 16px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* RIQUADRO ROSSO PER H24 */
        .badge-h24 {
            background-color: #e60000;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 3px 6px;
            border-radius: 5px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 8px rgba(230, 0, 0, 0.4);
        }

        .btn-label {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* --- BOX INFORMATIVI (PAGINA 1 e 2) --- */
        .info-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px;
            width: 100%;
            text-align: left;
            margin-top: 14px; /* Spostato leggermente più in basso */
        }

        .info-box-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .info-box-title svg.web-icon {
            width: 16px;
            height: 16px;
            fill: rgba(255, 255, 255, 0.9);
            flex-shrink: 0;
        }

        .info-box-desc {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.4;
            margin-bottom: 10px;
        }

        /* NUOVO COLORE BLU/GRIGIO CHIARO PER I TASTI D'AZIONE */
        .info-action-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: rgba(41, 128, 185, 0.85);
            border: 1px solid rgba(52, 152, 219, 0.5);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 9px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.25);
            transition: all 0.2s;
        }

        .info-action-btn:active {
            background: rgba(41, 128, 185, 1);
            transform: scale(0.98);
        }

        /* AZIENDA & PARTITA IVA (SOLO SECONDA PAGINA) */
        .company-info {
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.8);
            user-select: none;
            width: 100%;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .company-name {
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 2px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .piva-text {
            color: rgba(255, 255, 255, 0.6) !important;
            font-size: 0.78rem;
            font-weight: 500;
            display: block;
            margin-top: 2px;
        }

        /* SWIPE HINT TEXT */
        .swipe-hint {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* ----------------------------------------------------
            ANIMAZIONI LENTE
        ---------------------------------------------------- */
        .animate-in {
            animation: fadeInVerySlow 3.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        .animate-line {
            animation: expandLineVerySlow 3.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        @keyframes fadeInVerySlow {
            0% { opacity: 0; transform: translateY(25px); filter: blur(12px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0px); }
        }

        @keyframes expandLineVerySlow {
            0% { opacity: 0; transform: scaleX(0); }
            100% { opacity: 1; transform: scaleX(1); }
        }

        /* TEMPI DI APPARIZIONE */
        .delay-1 { animation-delay: 3.8s; } 
        .delay-2 { animation-delay: 4.3s; } 
        .delay-3 { animation-delay: 4.8s; } 
        .delay-3-5 { animation-delay: 5.1s; } 
        .delay-4 { animation-delay: 5.4s; } 
        .delay-5 { animation-delay: 5.9s; } 
    </style>
</head>

<body>

    <!-- INTRO LOGO -->
    <div id="loader">
        <img src="logo intro.png" alt="Logo" class="intro-logo-img">
    </div>

    <!-- CONTAINER PRINCIPALE -->
    <div class="card-container">
        
        <!-- WRAPPER DELLE DUE PAGINE (GESTIONE SWIPE) -->
        <div class="pages-wrapper" id="pagesWrapper">
            
            <!-- ================= PAGINA 1 ================= -->
            <div class="card-page">
                <div class="header-content">
                    <!-- Logo Impromart -->
                    <div class="card-logo-container animate-in delay-1">
                        <img src="logo impromart.png" alt="Logo Impromart" class="card-logo-img">
                    </div>

                    <!-- Testo su due righe -->
                    <div class="job-title animate-in delay-2">
                        CONCESSIONARIA E OFFICINA<br>AUTORIZZATA MAN
                    </div>

                    <!-- Linea Rossa MAN -->
                    <div class="red-line animate-line delay-3"></div>

                    <!-- Frase Come possiamo aiutarti? -->
                    <div class="help-text animate-in delay-3-5">
                        Come possiamo aiutarti?
                    </div>

                    <!-- Contatti -->
                    <div class="contact-info">
                        <!-- H24 -->
                        <a href="tel:99999999999" class="btn-action animate-in delay-4">
                            <span class="badge-h24">H24</span> 999 999 999 99
                        </a>

                        <!-- OFFICINA + vCard -->
                        <a href="#" onclick="handlePhone
