<!DOCTYPE html>

<html lang="it">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    

    <!-- FORZA BARRE BROWSER NERE E SCURE SU IPHONE E ANDROID -->

    <meta name="theme-color" content="#000000">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="format-detection" content="telephone=no">



    <title>Impromart - MAN</title>

    <!-- Font moderno e pulito -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">



    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }



        html {

            background-color: #000000;

            width: 100%;

            height: 100%;

        }



        body {

            width: 100%;

            height: 100%;

            min-height: 100vh;

            min-height: 100dvh;

            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

            color: #ffffff;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            -webkit-font-smoothing: antialiased;

        }



        /* ----------------------------------------------------

            1. SCHERMATA INTRO LOGO (3 SECONDI)

        ---------------------------------------------------- */

        #loader {

            position: fixed;

            inset: 0;

            background: #000000;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 9999;

            transition: opacity 1s ease;

        }



        #loader.hidden {

            opacity: 0;

            pointer-events: none;

        }



        .intro-logo-img {

            max-width: 50vw;

            max-height: 35vh;

            object-fit: contain;

            opacity: 0;

            transform: scale(0.92);

            filter: blur(12px);

            animation: continuousZoomFade 2.8s linear forwards;

        }



        @keyframes continuousZoomFade {

            0% { opacity: 0; transform: scale(0.92); filter: blur(12px); }

            30% { opacity: 1; filter: blur(0px); }

            70% { opacity: 1; filter: blur(0px); }

            100% { opacity: 0; transform: scale(1.05); filter: blur(10px); }

        }



        /* ----------------------------------------------------

            2. BIGLIETTO DA VISITA DIGITALE

        ---------------------------------------------------- */

        .card {

            width: 90%;

            max-width: 380px;

            height: 94vh;

            max-height: 800px;

            padding: 26px 20px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            align-items: center;

            text-align: center;

            box-sizing: border-box;

            background: rgba(255, 255, 255, 0.03);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 24px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);

            opacity: 0;

            animation: fadeInCard 1.2s ease forwards 2.8s;

        }



        @keyframes fadeInCard {

            to { opacity: 1; }

        }



        .header-content {

            display: flex;

            flex-direction: column;

            align-items: center;

            width: 100%;

        }



        /* LOGO PRINCIPALE ANCOR PIÙ GRANDE */

        .main-logo-container {

            width: 100%;

            max-height: 105px;

            display: flex;

            align-items: center;

            justify-content: center;

            opacity: 0;

            transform: translateY(25px);

            filter: blur(12px);

        }



        .main-logo-img {

            max-width: 95%;

            max-height: 100px;

            object-fit: contain;

        }



        /* RUOLO / CONCESSIONARIA SU DUE RIGHE E PIÙ GRANDE */

        .job-title {

            font-size: 0.78rem;

            font-weight: 700;

            letter-spacing: 1px;

            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.75);

            margin-top: 10px;

            line-height: 1.4;

            opacity: 0;

            transform: translateY(25px);

            filter: blur(12px);

            width: 100%;

        }



        /* LINEA ROSSA MAN */

        .red-line {

            width: 100px;

            height: 3px;

            background-color: #e60000;

            margin: 12px auto 16px auto;

            border-radius: 2px;

            opacity: 0;

            transform: scaleX(0);

            transform-origin: center;

            box-shadow: 0 0 12px rgba(230, 0, 0, 0.5);

        }



        /* CONTATTI (PULSANTI/SCHEDE) */

        .contact-info {

            display: flex;

            flex-direction: column;

            gap: 9px;

            width: 100%;

        }



        .btn-action {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 12px;

            padding: 10px 14px;

            color: #ffffff;

            text-decoration: none;

            font-size: 0.88rem;

            font-weight: 500;

            letter-spacing: 0.3px;

            opacity: 0;

            transform: translateY(25px);

            filter: blur(10px);

            transition: all 0.2s ease;

            cursor: pointer;

        }



        .btn-action:active {

            background: rgba(230, 0, 0, 0.2);

            border-color: #e60000;

            transform: scale(0.98);

        }



        /* ICONE VETTORIALI BIANCHE */

        .svg-icon {

            width: 18px;

            height: 18px;

            fill: #ffffff;

            flex-shrink: 0;

        }



        /* BADGE H24 PERSONALIZZATO */

        .h24-badge {

            background-color: #e60000;

            color: #ffffff;

            font-size: 0.65rem;

            font-weight: 800;

            padding: 3px 6px;

            border-radius: 4px;

            letter-spacing: 0.5px;

            flex-shrink: 0;

            box-shadow: 0 0 8px rgba(230, 0, 0, 0.6);

        }



        /* SEZIONE SOCIAL & WEB IN BASSO */

        .social-web-container {

            display: flex;

            gap: 10px;

            width: 100%;

            opacity: 0;

            transform: translateY(25px);

            filter: blur(10px);

        }



        .btn-social {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            background: rgba(255, 255, 255, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 12px;

            padding: 9px;

            color: #ffffff;

            text-decoration: none;

            font-size: 0.8rem;

            font-weight: 500;

            transition: all 0.2s ease;

        }



        .btn-social:active {

            background: rgba(230, 0, 0, 0.2);

            border-color: #e60000;

            transform: scale(0.98);

        }



        /* AZIENDA & PARTITA IVA */

        .company-info {

            text-align: center;

            font-size: 0.78rem;

            line-height: 1.4;

            color: rgba(255, 255, 255, 0.8);

            opacity: 0;

            transform: translateY(25px);

            filter: blur(10px);

            user-select: none;

            width: 100%;

            margin-top: 4px;

        }



        .company-name {

            font-weight: 800;

            font-size: 0.9rem;

            margin-bottom: 2px;

            color: #ffffff;

            letter-spacing: 0.5px;

        }



        .piva-text {

            color: rgba(255, 255, 255, 0.6) !important;

            -webkit-text-fill-color: rgba(255, 255, 255, 0.6) !important;

            text-decoration: none !important;

            font-size: 0.72rem;

            font-weight: 500;

            display: block;

            margin-top: 2px;

        }



        /* ----------------------------------------------------

            ANIMAZIONI LENTE

        ---------------------------------------------------- */

        .animate-in {

            animation: fadeInVerySlow 3.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;

        }



        .animate-line {

            animation: expandLineVerySlow 3.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;

        }



        @keyframes fadeInVerySlow {

            0% {

                opacity: 0;

                transform: translateY(25px);

                filter: blur(12px);

            }

            100% {

                opacity: 1;

                transform: translateY(0);

                filter: blur(0px);

            }

        }



        @keyframes expandLineVerySlow {

            0% {

                opacity: 0;

                transform: scaleX(0);

            }

            100% {

                opacity: 1;

                transform: scaleX(1);

            }

        }



        /* TEMPI DI APPARIZIONE SEQUENZIALI */

        .delay-1 { animation-delay: 3.8s; } /* Logo principale */

        .delay-2 { animation-delay: 4.3s; } /* Ruolo / Concessionaria */

        .delay-3 { animation-delay: 4.8s; } /* Linea Rossa */

        .delay-4 { animation-delay: 5.3s; } /* Email */

        .delay-5 { animation-delay: 5.8s; } /* Telefono */

        .delay-6 { animation-delay: 6.3s; } /* Soccorso H24 */

        .delay-7 { animation-delay: 6.8s; } /* Social & Web */

        .delay-8 { animation-delay: 7.3s; } /* Info Aziendali */

    </style>

</head>



<body>

        </div>



        <!-- SOCIAL & WEB -->

        <div class="social-web-container animate-in delay-7">

    <script>

        // Nasconde l'intro e sblocca la pagina dopo 2.8s

        setTimeout(() => {

            const loader = document.getElementById("loader");

            if (loader) {

                loader.classList.add("hidden");

                setTimeout(() => loader.style.display = 'none', 1000);

            }

        }, 2800);



        // Gestione Salva Contatto + Chiamata al tap del numero principale

        function handlePhoneClick(e) {

            e.preventDefault();

            

            const vcardData = 

`BEGIN:VCARD

VERSION:3.0

N:Impromart;Concessionaria;;;

FN:Impromart SRL - MAN

ORG:Impromart SRL

TITLE:Concessionaria ed Officina Autorizzata MAN

TEL;TYPE=WORK:+390815962139

EMAIL;TYPE=WORK:info@impromart.com

ADR;TYPE=WORK:;;Traversa Fossitelli snc;Napoli;;80147;Italy

URL:https://www.impromart.it

END:VCARD`;



            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });

            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');

            a.href = url;

            a.setAttribute('download', 'Impromart_MAN.vcf');

            document.body.appendChild(a);

            a.click();

            document.body.removeChild(a);



            setTimeout(() => {

                window.location.href = "tel:+390815962139";

            }, 300);

        }

    </script>
