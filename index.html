<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- FORZA BARRE BROWSER NERE E SCURE SU IPHONE E ANDROID -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <title>Impromart - MAN</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #000000;
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: #1a232c;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------------------------
            1. SCHERMATA INTRO LOGO (3 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-logo-img {
            max-width: 50vw;
            max-height: 35vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(12px);
            animation: continuousZoomFade 2.8s linear forwards;
        }

        @keyframes continuousZoomFade {
            0% { opacity: 0; transform: scale(0.92); filter: blur(12px); }
            30% { opacity: 1; filter: blur(0px); }
            70% { opacity: 1; filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.05); filter: blur(10px); }
        }

        /* ----------------------------------------------------
            2. BIGLIETTO DA VISITA DIGITALE
        ---------------------------------------------------- */
        .card {
            width: 90%;
            max-width: 400px;
            max-height: 92vh;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            background: #2d3a47;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            opacity: 0;
            animation: fadeInCard 1.2s ease forwards 2.8s;
            overflow-y: auto;
        }

        @keyframes fadeInCard {
            to { opacity: 1; }
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* LOGO PRINCIPALE */
        .main-logo-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        .main-logo-img {
            max-width: 80%;
            max-height: 70px;
            object-fit: contain;
        }

        /* RUOLO / CONCESSIONARIA */
        .job-title {
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
            width: 100%;
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 80px;
            height: 3px;
            background-color: #e60000;
            margin: 16px auto 18px auto;
            border-radius: 2px;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: center;
            box-shadow: 0 0 10px rgba(230, 0, 0, 0.6);
        }

        /* FRASE IN EVIDENZA */
        .callout-text {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 18px;
            letter-spacing: 0.3px;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        /* TITOLO SEZIONE BACK OFFICE */
        .section-title {
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-top: 22px;
            margin-bottom: 12px;
            text-align: center;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
        }

        /* CONTATTI (PULSANTI/SCHEDE) */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 12px 16px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-action:active {
            background: rgba(230, 0, 0, 0.25);
            border-color: #e60000;
            transform: scale(0.98);
        }

        /* ICONE VETTORIALI BIANCHE */
        .svg-icon {
            width: 20px;
            height: 20px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* BADGE H24 PERSONALIZZATO */
        .h24-badge {
            background-color: #e60000;
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(230, 0, 0, 0.6);
        }

        /* SEZIONE SOCIAL & WEB IN BASSO */
        .social-web-container {
            display: flex;
            gap: 12px;
            width: 100%;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            margin-top: 18px;
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 11px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-social:active {
            background: rgba(230, 0, 0, 0.25);
            border-color: #e60000;
            transform: scale(0.98);
        }

        /* AZIENDA & PARTITA IVA */
        .company-info {
            text-align: center;
            font-size: 0.82rem;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.85);
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            user-select: none;
            width: 100%;
            margin-top: 22px;
        }

        .company-name {
            font-weight: 800;
            font-size: 0.98rem;
            margin-bottom: 3px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .piva-text {
            color: rgba(255, 255, 255, 0.7) !important;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.7) !important;
            text-decoration: none !important;
            font-size: 0.78rem;
            font-weight: 500;
            display: block;
            margin-top: 3px;
        }

        /* ----------------------------------------------------
            ANIMAZIONI LENTE
        ---------------------------------------------------- */
        .animate-in {
            animation: fadeInVerySlow 3.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        .animate-line {
            animation: expandLineVerySlow 3.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        @keyframes fadeInVerySlow {
            0% {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes expandLineVerySlow {
            0% {
                opacity: 0;
                transform: scaleX(0);
            }
            100% {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* TEMPI DI APPARIZIONE SEQUENZIALI */
        .delay-1 { animation-delay: 3.8s; } /* Logo principale */
        .delay-2 { animation-delay: 4.2s; } /* Ruolo / Concessionaria */
        .delay-3 { animation-delay: 4.6s; } /* Linea Rossa */
        .delay-4 { animation-delay: 5.0s; } /* Frase aiuto */
        .delay-5 { animation-delay: 5.4s; } /* Email principale */
        .delay-6 { animation-delay: 5.8s; } /* Telefono principale */
        .delay-7 { animation-delay: 6.2s; } /* Soccorso H24 */
        .delay-8 { animation-delay: 6.6s; } /* Titolo Back Office */
        .delay-9 { animation-delay: 7.0s; } /* Email Back Office */
        .delay-10 { animation-delay: 7.4s; } /* Telefono Back Office */
        .delay-11 { animation-delay: 7.8s; } /* Social & Web */
        .delay-12 { animation-delay: 8.2s; } /* Info Aziendali */
    </style>
</head>

<body>

    <!-- INTRO LOGO -->
    <div id="loader">
        <img src="logo intro.png" alt="Logo" class="intro-logo-img">
    </div>

    <!-- CARD DIGITALE -->
    <div class="card">
        <div class="header-content">
            <!-- Logo Principale -->
            <div class="main-logo-container animate-in delay-1">
                <img src="logo impromart.png" alt="Logo Impromart" class="main-logo-img">
            </div>

            <!-- Ruolo / Concessionaria su due righe -->
            <div class="job-title animate-in delay-2">
                CONCESSIONARIA E OFFICINA<br>AUTORIZZATA MAN
            </div>

            <!-- Linea Rossa MAN -->
            <div class="red-line animate-line delay-3"></div>

            <!-- Frase in Evidenza -->
            <div class="callout-text animate-in delay-4">
                Come possiamo aiutarti?
            </div>

            <!-- Contatti Principali -->
            <div class="contact-info">
                <!-- EMAIL PRINCIPALE -->
                <a href="mailto:info@impromart.com" class="btn-action animate-in delay-5">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    info@impromart.com
                </a>

                <!-- TELEFONO PRINCIPALE -->
                <a href="#" onclick="handlePhoneClick(event)" class="btn-action animate-in delay-6">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17
